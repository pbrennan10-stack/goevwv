# Backup power from an EV when the grid goes down — three rungs, cheapest first.
# Read by lib/backup.ts for /learn/power-outages, /ev/[id], and the planner's
# used shopping list. Researched 2026-09-29 (AI-assisted; a source per entry;
# summarized on /state-of-the-data). Only vehicles in vehicles.json appear here.
retrieved: "2026-09-29"

# Daily use behind the "days of backup" math. 30 kWh a day is what Ford and
# Tesla assume in their own backup claims and matches EIA's US average
# (899 kWh a month). "Essentials" — fridge, freezer, furnace blower, well or
# sump pump, lights, phones — is our approximate figure.
typical_home_kwh_per_day: 30
essentials_kwh_per_day: 10
# Share of the battery we count: leaves range to reach a charger afterward
# and covers inverter losses.
usable_share: 0.8
daily_kwh_source: "EIA: the average US residential customer used 10,791 kWh in 2022, about 899 kWh a month"
daily_kwh_source_url: "https://www.eia.gov/tools/faqs/faq.php?id=97&t=3"
daily_kwh_notes: >
  Ford and Tesla both quote days of backup at 30 kWh a day. The essentials-only
  figure is ours and approximate: a fridge and freezer run about 3 kWh a day, a
  gas furnace blower 3–5 kWh in winter, a well pump 1–2, lights and phones about
  1. Electric heat, an electric water heater, or central air would use far more.

# Rung 2: a 240-volt outlet on the vehicle feeding a generator-style transfer
# switch or interlock — the same hookup as a portable generator, covering the
# circuits you choose. A licensed electrician installs it; never backfeed
# through a dryer outlet.
transfer_switch:
  - ids: [ford-f150-lightning-2025, ford-f150-lightning-er-2025]
    outlet: "240 V / 30 A (L14-30) in the bed"
    kw_240v: 7.2
    kw_total: 9.6
    requires: "Needs the 9.6 kW Pro Power Onboard system — standard on Lariat and Platinum, standard or optional on XLT depending on model year. The fleet Pro trim's 2.4 kW system has 120-volt outlets only."
    hookup: "Ford's route (July 2026): a GenerLink transfer switch at the meter plus Ford's 12-inch Vehicle Connector, which keeps the truck's built-in ground-fault protection from cutting the power. The connector is approved only for that use."
    cost: "About $1,100 for the switch, cord and connector, plus $250–$450 when the utility installs it on the meter, or $1,000–$1,500 for the beside-the-meter version"
    maker_runtime_days:
      ford-f150-lightning-2025: 2
      ford-f150-lightning-er-2025: 3
    source: "Ford Pro Power Onboard support page; Ford's announcement as reported by Electrek, July 22, 2026"
    source_url: "https://electrek.co/2026/07/22/ford-f-150-electric-trucks-can-now-power-home-electrical-panel/"
    retrieved: "2026-09-29"
    confidence: verified
  - ids: [chevy-silverado-ev-2025, chevy-silverado-ev-wt-2027, gmc-sierra-ev-denali-2025]
    outlet: "240 V / 30 A in the bed (PowerBase)"
    kw_240v: 7.2
    kw_total: 10.2
    hookup: "A transfer switch or interlock installed by a licensed electrician. GM's supported route is its V2H bundle (below)."
    cost: "A transfer switch or interlock plus an electrician — typically several hundred dollars to about $1,500"
    source: "Owner documentation (Silverado EV forum); Chevrolet's PowerBase guide could not be read"
    source_url: "https://www.silveradoevforum.com/threads/power-base-240v-outlet.2035/"
    retrieved: "2026-09-29"
    confidence: approximate
  - ids: [tesla-cybertruck-2025]
    outlet: "240 V / 40 A in the bed"
    kw_total: 9.6
    hookup: "Tesla's supported route is Powershare Home Backup through the charge port (below); a transfer switch on the bed outlet isn't Tesla's documented path."
    cost: "A transfer switch or interlock plus an electrician"
    source: "Green Car Reports"
    source_url: "https://www.greencarreports.com/news/1141606_powershare-in-tesla-cybertruck-can-power-home-charge-other-evs"
    retrieved: "2026-09-29"
    confidence: approximate

