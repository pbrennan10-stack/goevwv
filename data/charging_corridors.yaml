# WV EV Charging Infrastructure — curated quarterly alongside vehicle MSRPs
# Last updated: 2026-09-23 (NEVI status + statewide counts refreshed; corridor
#   station lists below were NOT re-verified this cycle — last curated 2026-04-18)
# Sources: AFDC station + registration data, dcfctracker.com, WVDOT NEVI pages,
#   EV States Clearinghouse awards dashboard, Tesla.com/findus, PlugShare
# Coverage rating: good = no gaps >50 mi, moderate = some gaps 50-80 mi, thin = gaps >80 mi

nevi_status:
  allocation_usd: 45700000
  allocation_note: "Allocated over 5 years under IIJA/BIL"
  rfp_issued: false
  current_phase: "Program planning and management (Phase 1)"
  stations_planned: 15  # from earlier WVDOT plan; not re-confirmed on current WVDOT pages
  estimated_stations_open: "2027–2028 (estimated)"
  as_of: "September 2026"
  source_url: "https://transportation.wv.gov/nevi-home"
  # Keep this note factual and neutral — describe status, don't characterize pace.
  note: >
    The federal NEVI program funds new DC fast-charging stations along West
    Virginia's interstate corridors (I-64, I-77, I-79, I-81, and I-70).
    WVDOT updated its NEVI deployment plan in September 2025 and began Phase 1
    program management in 2026. NEVI-funded stations are not yet open; the
    first are estimated for 2027–2028. See WVDOT's NEVI page for the latest
    status, and plan trips around today's network in the meantime.

statewide_summary:
  public_ports_approx: 543      # AFDC: 324 L2 + 217 DCFC + 2 L1 ports
  l2_ports_approx: 324
  dcfc_ports_approx: 217
  dcfc_sites_approx: 56         # dcfctracker.com (AFDC doesn't split DCFC locations)
  as_of: "September 2026"
  bev_registrations: 5000       # AFDC 2025 registration data (rounded), published June 2026
  phev_registrations: 2700
  bev_pct_of_vehicles: 0.38     # of ~1,323,000 light-duty vehicles
  sources:
    - "https://afdc.energy.gov/stations/states"
    - "https://afdc.energy.gov/vehicle-registration"
    - "https://dcfctracker.com/states/wv"

corridors:
  - id: i64
    name: "I-64 — East-West Spine"
    description: "Huntington to Lewisburg. Main corridor for Charleston and most of central WV."
    coverage: good
    length_wv_mi: 180
    stations:
      - city: Huntington
        network: Tesla Supercharger
        stalls: 8
        kw: 150
        note: "Open to non-Tesla with CCS adapter"
      - city: Charleston
        network: Tesla Supercharger
        stalls: 8
        kw: 150
        note: "Kanawha City; open to non-Tesla"
      - city: Beckley
        network: "Multiple (ChargePoint, Tesla)"
        stalls: 6
        kw: 50
        note: "Near Tamarack; NEVI planned stop"
      - city: Princeton
        network: Tesla Supercharger
        stalls: 4
        kw: 150
      - city: Lewisburg
        network: Tesla Supercharger
        stalls: 6
        kw: 150
        note: "Greenbrier Valley; also NEVI planned stop"
    gaps:
      - description: "Princeton to Lewisburg — ~65 miles with limited non-Tesla DCFC"
        severity: moderate
        note: "Tesla covers this gap; non-Tesla CCS options are sparse"

  - id: i79
    name: "I-79 — North-South Backbone"
    description: "Morgantown to Charleston. Most traveled N-S route in WV."
    coverage: thin
    length_wv_mi: 160
    stations:
      - city: Morgantown
        network: Tesla Supercharger
        stalls: 8
        kw: 150
        note: "Multiple locations; Sheetz DCFC also available"
      - city: Fairmont
        network: Tesla Supercharger
        stalls: 6
        kw: 150
      - city: Clarksburg
        network: ChargePoint
        stalls: 2
        kw: 50
        note: "Level 2 only at some locations"
      - city: Charleston
        network: Tesla Supercharger
        stalls: 8
        kw: 150
    gaps:
      - description: "Clarksburg to Charleston — ~100 miles; limited DCFC mid-route"
        severity: high
        note: "Weston and Sutton are planned NEVI stops. Plan charging stops ahead on this stretch."

  - id: i77
    name: "I-77 — WV Turnpike (North-South)"
    description: "Beckley to Parkersburg. Main route for southern WV and Ohio border."
    coverage: thin
    length_wv_mi: 130
    stations:
      - city: Beckley
        network: "Multiple (ChargePoint, Tesla)"
        stalls: 6
        kw: 50
      - city: Ripley
        network: Planned NEVI
        stalls: 0
        kw: 0
        note: "Planned NEVI stop (not yet open)"
      - city: Parkersburg
        network: Tesla Supercharger
        stalls: 6
        kw: 150
    gaps:
      - description: "Beckley to Ripley to Parkersburg — sparse non-Tesla DCFC across ~130 miles"
        severity: high
        note: "Ripley is a planned NEVI stop (not yet open). Use PlugShare to check current options."

  - id: i81
    name: "I-81 — Eastern Panhandle"
    description: "Martinsburg area. Short WV segment; benefits from Pennsylvania and Virginia spillover."
    coverage: good
    length_wv_mi: 24
    stations:
      - city: Martinsburg
        network: Tesla Supercharger
        stalls: 8
        kw: 250
        note: "V3 Supercharger; excellent coverage for this short corridor"
    gaps: []

  - id: i70
    name: "I-70 — Northern Panhandle"
    description: "Wheeling and surrounds. Benefits from Ohio and Pennsylvania DCFC network spillover."
    coverage: good
    length_wv_mi: 20
    stations:
      - city: Wheeling
        network: "Multiple (Tesla, ChargePoint, Electrify America)"
        stalls: 10
        kw: 150
        note: "NEVI planned expansion; currently well-served by OH/PA corridor chargers"
    gaps: []

live_data_links:
  plugshare: "https://www.plugshare.com/"
  chargepoint: "https://www.chargepoint.com/find-a-charger/"
  tesla_supercharger: "https://www.tesla.com/findus"
  note: "Always check PlugShare for real-time charger availability before a long trip. Station status can change."
