# Federal tax credits and WV state fees relevant to EV ownership
# Updated: 2026-04-18 (verified against IRS, WV Code, AAA)

federal_ev_tax_credits:
  new_ev_credit:
    active: false
    status_note: >
      The IRC 30D clean vehicle credit was terminated by Public Law 119-21
      (the "One Big Beautiful Bill Act", enacted July 4, 2025). Not allowed
      for any vehicle acquired after September 30, 2025. Update active to true
      only if Congress reinstates it.
    termination_date: "2025-09-30"
    termination_statute: "P.L. 119-21 (OBBB)"
    code_section: "IRC 30D"
    max_amount_usd: 7500
    breakdown:
      critical_minerals_component: 3750
      battery_components_component: 3750
    structure: >
      Up to $7,500 for qualifying new EVs and PHEVs. Half depends on battery
      critical-minerals sourcing, the other half on battery component sourcing.
      Both halves are required to get the full $7,500.
    income_caps:
      single: 150000
      head_of_household: 225000
      joint: 300000
    msrp_caps:
      cars: 55000
      suvs_trucks_vans: 80000
    point_of_sale_option: true
    point_of_sale_notes: >
      Since Jan 2024, buyers can transfer the credit to the dealer at point of
      sale as a down-payment discount, rather than waiting for tax filing.
    url: "https://www.irs.gov/credits-deductions/credits-for-new-clean-vehicles-purchased-in-2023-or-after"

  used_ev_credit:
    active: false
    status_note: >
      The IRC 25E used clean vehicle credit was terminated alongside 30D by
      P.L. 119-21. Not allowed for any vehicle acquired after September 30, 2025.
    termination_date: "2025-09-30"
    termination_statute: "P.L. 119-21 (OBBB)"
    code_section: "IRC 25E"
    max_amount_usd: 4000
    structure: "30% of sale price, capped at $4,000"
    eligibility:
      - "Vehicle model year must be at least 2 years old"
      - "Sale price under $25,000"
      - "Purchased from a licensed dealer"
      - "First resale after Aug 16 2022"
    income_caps:
      single: 75000
      head_of_household: 112500
      joint: 150000
    url: "https://www.irs.gov/credits-deductions/used-clean-vehicle-credit"

  refueling_property_credit:
    code_section: "IRC 30C"
    termination_date: "2026-06-30"
    termination_statute: "P.L. 119-21 (OBBB)"
    termination_notes: >
      Per IRS FAQ on P.L. 119-21, the 30C credit is not allowed for any
      property placed in service after June 30, 2026 — this applies to BOTH
      residential and commercial installations. Users installing a home
      charger should aim to complete installation before that date.
    residential:
      max_amount_usd: 1000
      structure: "30% of cost, up to $1,000, for home EV charging equipment"
      eligibility_notes: "Must be located in eligible census tract (low-income or non-urban)"
    commercial:
      max_amount_per_port_usd: 100000
      structure: "30% of cost per port, up to $100,000/port"
    url: "https://www.irs.gov/newsroom/faqs-for-modification-of-sections-25c-25d-25e-30c-30d-45l-45w-and-179d-under-public-law-119-21-139-stat-72-july-4-2025-commonly-known-as-the-one-big-beautiful-bill-obbb"

wv_state_fees:
  # How these stack up per WV Code §17A-10-3c:
  #   ICE car:  $51.50 Class A base
  #   PHEV:     $51.50 base + $100 surcharge = $151.50 total
  #   BEV:      $51.50 base + $200 surcharge = $251.50 total
  # The calculator uses the SURCHARGE values (200 / 100) as the EV/PHEV-specific
  # addition to annual operating cost. The $51.50 base is paid by every Class A
  # vehicle regardless of powertrain, so it cancels out of EV-vs-gas comparisons
  # and is not added on either side. The ~$250 figure seen in casual sources is
  # total BEV registration, not the surcharge — do not substitute it here.
  bev_annual_fee:
    amount_usd: 200
    description: >
      Battery-electric vehicles pay a $200 annual surcharge on top of the
      $51.50 Class A base registration, for a total of $251.50. The $200
      surcharge is the EV-specific addition.
    statute: "WV Code §17A-10-3c"
    statute_url: "https://code.wvlegislature.gov/17A-10-3c/"
    afdc_confirmation: "https://afdc.energy.gov/laws/all?state=WV"
    important_note: >
      This surcharge materially changes the TCO calculation. A WV EV owner
      driving 10,000 miles/year effectively pays 2.0¢/mile in state road tax
      vs. a gasoline vehicle paying ~1.4¢/mile at 25 mpg at the state gas
      tax rate.

  phev_annual_fee:
    amount_usd: 100
    description: >
      Plug-in hybrids pay a $100 annual surcharge on top of the $51.50 Class A
      base registration, for a total of $151.50. The $100 surcharge is the
      PHEV-specific addition used in TCO math.
    statute: "WV Code §17A-10-3c"
    statute_url: "https://code.wvlegislature.gov/17A-10-3c/"
    afdc_confirmation: "https://afdc.energy.gov/laws/all?state=WV"

  standard_registration_fee:
    amount_usd: 51.50
    description: "Standard WV Class A passenger vehicle registration (separate from EV fee)"
    source_url: "https://feecalculator.us/west-virginia-vehicle-registration-fee-calculator/"
    notes: "Includes $1.00 litter fee and $0.50 insurance fee"

wv_state_incentives:
  status: "NONE"
  notes: >
    West Virginia does not currently offer state-level tax credits, rebates,
    or purchase incentives for new or used EVs. The only WV-level financial
    levers are: (1) utility rebates (see utilities.yaml), (2) the $200/$100
    annual EV/PHEV fee (negative), and (3) any local initiatives from
    municipalities or economic development programs.
  source: "https://afdc.energy.gov/laws/all?state=WV"

calculation_notes:
  winter_range_derating:
    default_percent: 0.28
    rationale: >
      WV winters reach sub-freezing regularly. Industry research (AAA, Recurrent,
      Geotab) shows 20-40% range loss at cold temps depending on model and HVAC
      use. We default to 28% for conservative estimates and show the un-derated
      range alongside.

  gas_price_baseline_per_gal:
    current: 3.90
    source: "AAA West Virginia average"
    source_url: "https://gasprices.aaa.com/?state=WV"
    retrieved: "2026-04-18"
    notes: >
      AAA WV average as of retrieval date. Pump prices vary meaningfully
      across the state — Parkersburg was ~22¢ below the northern WV average
      at this snapshot. Users can override this in the calculator. Refresh
      quarterly.
