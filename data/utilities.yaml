# WV utility data for GoEV WV
# Updated: 2026-04-18 (verified against utility sites, AFDC, AEP Off-Peak page)
# Rates should be refreshed quarterly against utility tariff sheets or WV PSC filings.

# ---------------------------------------------------------------
# APPALACHIAN POWER (AEP) - serves southern & central WV
# ---------------------------------------------------------------
aep:
  name: "Appalachian Power"
  parent_company: "American Electric Power"
  website: "https://www.appalachianpower.com"
  service_area: "Southern and central West Virginia"
  customer_service_phone: "1-800-956-4237"

  residential:
    # Source: AEP WV bill examples page (effective Dec 12, 2025) and AEP off-peak EV page.
    # Bill examples: 1,000 kWh = $176.43; 2,000 kWh = $332.13.
    # Deriving: fixed charges = $20.73/mo; marginal variable rate = $0.1557/kWh.
    # The marginal rate is what EV charging actually costs (each additional kWh).
    # The all-in average at 1,000 kWh is ~$0.176/kWh (matches AEP's "17.6 cents" quote).
    flat_rate_per_kwh: 0.156  # marginal rate — correct for EV cost calculations
    all_in_rate_per_kwh_at_1000kwh: 0.176  # displayed average; higher because it spreads fixed charges
    monthly_customer_charge: 20.73  # all fixed charges combined (base + all riders, Dec 2025)
    rate_notes: >
      AEP WV residential rates effective December 12, 2025. Bill examples: 1,000 kWh = $176.43;
      2,000 kWh = $332.13. This implies ~$20.73/month in fixed charges and a marginal
      variable rate of ~$0.156/kWh. The calculator uses the marginal rate because that
      is the actual cost of each additional kWh from EV charging — using the all-in
      average would overstate EV charging costs by ~13%. AEP rates have risen sharply
      since 2019 (+33%) and a further rate case was filed in 2025.

    tou_available: true
    tou_program_name: "WV Off-Peak EV Charging"
    tou_url: "https://www.appalachianpower.com/clean-energy/electric-cars/wv-off-peak"
    tou_schedule:
      off_peak_hours: "8:00 PM - 6:00 AM (Mon-Fri), all day Sat, Sun, and federal holidays"
      off_peak_rate_per_kwh: 0.129   # source: AEP off-peak page, current as of Apr 2026
      on_peak_rate_per_kwh: 0.227    # normal rate $0.176 + on-peak surcharge $0.051
    tou_requires_separate_meter: true
    tou_enrollment_notes: >
      Requires a separate EV meter on your charging circuit. AEP provides the meter
      hardware at no charge, but you must hire a licensed electrician to install the
      meter base and pass an electrical inspection before AEP installs the meter.
      No enrollment fee. Apply at appalachianpower.com or call 1-800-956-4237.

  rebates:
    - id: "aep-charge-forward-l2"
      name: "Charge Forward Level 2 Charger Rebate"
      type: "l2_charger"
      amount_usd: 250
      description: >
        Rebate of up to $250 for purchase and installation of an ENERGY STAR
        certified Level 2 EV charger.
      eligibility:
        - "Must be AEP residential customer"
        - "Charger must be ENERGY STAR certified"
      url: "https://takechargewv.com/programs/for-your-home/chargeforward"
      expires: null
      expires_notes: "Listed as active with no stated end date per AFDC WV incentive registry (retrieved 2026-04-18)"
      stackable_with_federal: true
      verified_source: "https://afdc.energy.gov/laws/all?state=WV"
      verified_date: "2026-04-18"

    - id: "aep-charge-forward-licensed-electrician"
      name: "Charge Forward Licensed Electrician Bonus"
      type: "installation"
      amount_usd: 250
      description: >
        Additional rebate of up to $250 if the Level 2 charger is installed by
        a licensed electrician.
      eligibility:
        - "Must be AEP residential customer"
        - "Installation by licensed electrician"
        - "Stacks with the L2 charger rebate above"
      url: "https://takechargewv.com/programs/for-your-home/chargeforward"
      expires: null
      expires_notes: "Bundled with Charge Forward L2 program; no stated end date as of 2026-04-18"
      stackable_with_federal: true
      verified_source: "https://afdc.energy.gov/laws/all?state=WV"
      verified_date: "2026-04-18"

  coverage_zip_prefixes: ["247", "248", "249", "253", "254", "255", "256", "257", "258", "259"]
  # Approximate southern/central WV ZIP prefixes; user ZIP lookup on the calculator
  # is a heuristic, not a bill-accurate service-territory map.

# ---------------------------------------------------------------
# MON POWER (FirstEnergy) - serves northern WV
# ---------------------------------------------------------------
mon_power:
  name: "Mon Power"
  parent_company: "FirstEnergy"
  website: "https://www.firstenergycorp.com/mon_power.html"
  service_area: "Northern and north-central West Virginia (34 counties)"
  customer_service_phone: "1-800-686-0022"

  residential:
    flat_rate_per_kwh: 0.138
    flat_rate_range: "0.1297 - 0.1377 by tariff zone"
    monthly_customer_charge: 8.00
    rate_source: "https://utility-rates.com/providers/mon-power"
    rate_retrieved: "2026-04-18"
    rate_notes: >
      Mon Power WV residential rates averaged ~13.8¢/kWh in March 2026 per
      tariff-verified data. Energy charge varies 12.97-13.77¢/kWh across
      service zones. Customer charge $8.00/month. Recent rate cases have
      approved double-digit increases; trend is upward. Authoritative source
      is the WVMPRetailTariff PDF at firstenergycorp.com — refresh against
      that quarterly.
    authoritative_source: "https://www.firstenergycorp.com/content/dam/customer/Customer%20Choice/Files/west-virginia/tariffs/WVMPRetailTariff.pdf"

    tou_available: false
    tou_program_name: null
    tou_notes: >
      Confirmed no residential EV TOU tariff in WV as of 2026-04-18.
      FirstEnergy's WV EV page directs users to an external ChooseEV Mon
      Power resource but lists no TOU rate. AFDC WV incentive registry
      lists no Mon Power TOU program. TOU pilots exist in other FirstEnergy
      states (PA, NJ) but not WV.
    tou_verified_source: "https://www.firstenergycorp.com/help/saving_energy/electric-vehicles/wv-ev.html"
    tou_verified_date: "2026-04-18"

  rebates: []
  rebates_notes: >
    Mon Power / FirstEnergy offers no WV residential EV charger rebate or
    TOU program as of 2026-04-18. AFDC WV registry lists zero FirstEnergy
    WV EV incentives. Do not add speculative entries; verify with
    FirstEnergy customer service if a program is launched.
  rebates_verified_source: "https://afdc.energy.gov/laws/all?state=WV"
  rebates_verified_date: "2026-04-18"

  coverage_zip_prefixes: ["262", "263", "264", "265", "266", "267", "268", "269"]
  # Approximate northern WV ZIP prefixes; heuristic, not bill-accurate.

# ---------------------------------------------------------------
# WHEELING POWER - AEP subsidiary serving northern panhandle
# ---------------------------------------------------------------
wheeling_power:
  name: "Wheeling Power"
  parent_company: "American Electric Power"
  website: "https://www.wheelingpower.com"
  service_area: "Northern panhandle (Wheeling and surrounding areas)"
  customer_service_phone: "1-800-982-4237"

  residential:
    # Wheeling Power is a small AEP subsidiary; rates track AEP closely but
    # have separate WV PSC tariff filings. Specific Wheeling Power residential
    # rate schedules were not independently verified on 2026-04-18 — site was
    # unreachable and no public rate summary was published on utility-rates
    # aggregators. Values below assume parity with the AEP tariff structure
    # as a best-available estimate. Refresh against WV PSC filings.
    flat_rate_per_kwh: 0.165
    monthly_customer_charge: 9.00
    rate_confidence: "approximate"
    rate_notes: >
      Wheeling Power serves ~40,000 customers in the northern panhandle and
      files separate tariffs from AEP, though structures are similar. Ohio
      County average residential price is ~17.56¢/kWh per findenergy.com.
      The values here are an approximation; users in the panhandle should
      verify with their actual bill.
    authoritative_source: "https://www.psc.state.wv.us"
    retrieved: "2026-04-18"

    tou_available: true
    tou_notes: "Same Charge Forward / Off-Peak program as AEP via TakeChargeWV"

  rebates:
    - id: "wheeling-power-charge-forward-l2"
      name: "Charge Forward Level 2 Charger Rebate (Wheeling Power)"
      type: "l2_charger"
      amount_usd: 250
      description: "Same program as AEP Charge Forward, administered jointly."
      url: "https://takechargewv.com/programs/for-your-home/chargeforward"
      expires: null
      expires_notes: "Same as AEP Charge Forward; active with no stated end date per AFDC (2026-04-18)"

  coverage_zip_prefixes: ["260", "261"]

# ---------------------------------------------------------------
# RURAL ELECTRIC COOPERATIVES
# ---------------------------------------------------------------
rural_coops:
  name: "Rural Electric Cooperatives"
  type: "aggregate"
  service_area: "Various rural WV counties"
  # Specific coop rates were not independently verified on 2026-04-18. Coop
  # websites do not generally publish rate schedules inline; rates require
  # tariff-document retrieval or direct contact. Per our v1 strategy we
  # display "contact your coop" rather than calculating off these estimates
  # for users whose ZIP resolves to a coop.
  rate_verification_status: "unverified — coop-specific rates require direct tariff retrieval"
  coops:
    - id: "harrison-rural"
      name: "Harrison Rural Electrification Association"
      website: "https://www.harrisonrea.com"
      estimated_rate_per_kwh: 0.115
      rate_confidence: "approximate"

    - id: "black-diamond-power"
      name: "Black Diamond Power"
      website: "https://www.blackdiamondpower.com"
      estimated_rate_per_kwh: 0.120
      rate_confidence: "approximate"

    - id: "craig-botetourt"
      name: "Craig-Botetourt Electric Cooperative"
      website: "https://www.cbec.coop"
      estimated_rate_per_kwh: 0.140
      rate_confidence: "approximate"

  v1_strategy: >
    For v1, show a "Contact your coop" card instead of specific rate calculations
    for users whose ZIP resolves to a coop service area. Display the coop name
    and website. Collect rate data and add specific calculations in v1.2.

  generic_fallback:
    flat_rate_per_kwh: 0.120  # WV coop average approximation
    disclaimer: "Coop rates vary. Contact your specific cooperative for accurate pricing."

# ---------------------------------------------------------------
# WV PUBLIC SERVICE COMMISSION
# ---------------------------------------------------------------
wvpsc:
  name: "West Virginia Public Service Commission"
  website: "https://www.psc.state.wv.us"
  role: "Approves utility rates and riders for investor-owned utilities"
  note: "Tariff sheets for AEP, Mon Power, Wheeling Power are filed here."
