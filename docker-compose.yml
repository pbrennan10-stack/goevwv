# GoEV WV production stack
# Start with:  docker compose up -d --build
# Status:      docker compose ps
# Logs:        docker compose logs -f
# Update:      git pull && docker compose up -d --build

services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN}
        NEXT_PUBLIC_GOATCOUNTER_CODE: ${NEXT_PUBLIC_GOATCOUNTER_CODE:-}
        OPENCHARGEMAP_API_KEY: ${OPENCHARGEMAP_API_KEY}
    image: goevwv:latest
    container_name: goevwv-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # Also needed at runtime: /chargers refreshes its OpenChargeMap data daily
      # in the background, and OpenChargeMap rejects requests without a key.
      OPENCHARGEMAP_API_KEY: ${OPENCHARGEMAP_API_KEY}
    # No ports exposed to the host; only Caddy talks to it over the internal network.
    networks:
      - goevwv_net

  # PI (Public Involvement), the sister site. Its image is built by the pi
  # repo's own GitHub Actions deploy and loaded onto the droplet by SSH; this
  # service only runs it. It sits in the "pi" profile so that goevwv's
  # `docker compose up -d` never fails when the pi image isn't loaded yet;
  # naming the service explicitly (`docker compose up -d --no-build pi`, which
  # the pi deploy does) enables the profile for that command.
  pi:
    image: pi:latest
    container_name: pi-app
    restart: unless-stopped
    profiles: ["pi"]
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    volumes:
      # The worst-intersection poll's SQLite database lives here, outside the
      # image, so deploys never lose votes. Never delete this volume.
      - pi_data:/app/data/runtime
    # No ports exposed to the host; only Caddy talks to it over the internal network.
    networks:
      - goevwv_net

  caddy:
    image: caddy:2-alpine
    container_name: goevwv-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # SSL certs persist across restarts
      - caddy_config:/config
    networks:
      - goevwv_net

volumes:
  caddy_data:
  caddy_config:
  pi_data:

networks:
  goevwv_net:
    driver: bridge
