# GoEV WV production stack
# Start with:  docker compose up -d --build
# Status:      docker compose ps
# Logs:        docker compose logs -f
# Update:      git pull && docker compose up -d --build

services:
  app:
    build: .
    image: goevwv:latest
    container_name: goevwv-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    # No ports exposed to the host; only Caddy talks to it over the internal network.
    networks:
      - goevwv_net

  caddy:
    image: caddy:2-alpine
    container_name: goevwv-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # SSL certs persist across restarts
      - caddy_config:/config
    networks:
      - goevwv_net

volumes:
  caddy_data:
  caddy_config:

networks:
  goevwv_net:
    driver: bridge
